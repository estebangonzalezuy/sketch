<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aerosol</title>
    <meta name="description" content="Turns photos and videos into a boiling, grainy airbrush look and exports an MP4." />
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="logo"></span>Aerosol</div>
      <div class="top-right">
        <span id="fps" class="fps"></span>
        <div id="res"></div>
        <button id="record" class="btn" type="button">Record with touch</button>
        <button id="png" class="btn" type="button" title="Save the hold frame as PNG">PNG</button>
        <button id="export" class="btn primary" type="button">Export</button>
      </div>
    </header>
    <aside id="left" class="col left"></aside>
    <main class="stage">
      <div id="viewport" class="viewport">
        <canvas id="view"></canvas>
        <div id="rec-badge" class="rec-badge" hidden>● REC</div>
      </div>
      <div class="transport">
        <button id="play" class="icon-btn" type="button" aria-label="Pause"></button>
        <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Timeline" />
        <span id="clock" class="clock">0.0 / 0.0 s</span>
      </div>
    </main>
    <aside id="right" class="col right"></aside>
    <div id="drop" class="drop" hidden><div>Drop photos or videos</div></div>
    <div id="overlay" class="overlay" hidden>
      <div class="dialog">
        <h2>Exporting</h2>
        <p id="progress-text">Preparing…</p>
        <div class="bar"><div id="progress-bar"></div></div>
        <button id="cancel" class="btn" type="button">Cancel</button>
      </div>
    </div>
    <input id="file" type="file" accept="image/*,video/*" multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
