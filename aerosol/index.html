<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aerosol</title>
    <meta name="description" content="Turns photos and videos into a boiling, grainy airbrush look and exports an MP4." />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Aerosol</div>
      <button id="preset-load" type="button">Open preset</button>
      <button id="preset-save" type="button">Save preset</button>
      <button id="png" type="button" title="Save the hold frame as PNG">PNG</button>
      <button id="export" class="primary" type="button">Export</button>
      <span class="spacer"></span>
      <label>Format <select id="frame"></select></label>
      <label>Size <select id="res"></select></label>
      <label>fps <span class="ro">30</span></label>
      <label>Duration <span id="duration" class="ro">0.0 s</span></label>
      <span id="fps" class="fps"></span>
    </header>
    <aside id="left" class="panel layers"></aside>
    <main class="stage">
      <div id="viewport" class="viewport">
        <canvas id="view"></canvas>
        <div id="rec-badge" class="rec-badge" hidden>● REC</div>
      </div>
    </main>
    <aside id="right" class="panel params"></aside>
    <section id="timeline" class="timeline" aria-label="Timeline"></section>
    <div id="drop" class="drop" hidden><div>Drop photos or videos</div></div>
    <div id="overlay" class="overlay" hidden>
      <div class="dialog">
        <h2>Exporting</h2>
        <p id="progress-text">Preparing…</p>
        <div class="bar"><div id="progress-bar"></div></div>
        <button id="cancel" class="btn" type="button">Cancel</button>
      </div>
    </div>
    <input id="file" type="file" accept="image/*,video/*" multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
