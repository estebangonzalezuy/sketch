<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="data:," />
<title>harmonógrafo</title>
<style>
@font-face { font-family: "Archivo Narrow"; src: url("/fonts/ArchivoNarrow-VariableFont_wght.ttf") format("truetype"); font-weight: 400 700; }
:root { --bg: #0C0C0C; --fg: #FFFFFF; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Archivo Narrow", sans-serif; font-size: 14px; }
#app { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
#stage { display: flex; align-items: center; justify-content: center; padding: 16px; }
canvas#c { height: calc(100vh - 32px); aspect-ratio: 1080/1350; outline: 1px solid var(--fg); }
#panel { border-left: 1px solid var(--fg); overflow-y: auto; padding: 14px 16px 40px; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.hint { opacity: .75; margin: 0 0 12px; line-height: 1.35; }
.sec { border-top: 1px solid var(--fg); padding: 10px 0 6px; margin-top: 8px; }
.sec > .t { font-weight: 600; margin-bottom: 6px; }
.row { display: grid; grid-template-columns: 86px 1fr 62px; gap: 8px; align-items: center; margin: 4px 0; }
.row input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; background: transparent; height: 16px; }
.row input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--fg); }
.row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 15px; background: var(--fg); margin-top: -7px; border: 0; }
.row input[type=range]::-moz-range-track { height: 1px; background: var(--fg); }
.row input[type=range]::-moz-range-thumb { width: 9px; height: 15px; background: var(--fg); border: 0; border-radius: 0; }
.row .num { width: 58px; text-align: right; font: inherit; font-variant-numeric: tabular-nums; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--fg); padding: 0; -moz-appearance: textfield; }
.row .num::-webkit-inner-spin-button { -webkit-appearance: none; }
select, button, input[type=file] { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--fg); border-radius: 0; padding: 4px 8px; }
select option { color: #0C0C0C; }
button { cursor: pointer; }
button:hover { background: var(--fg); color: var(--bg); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.pend { border: 1px solid var(--fg); padding: 6px 8px; margin: 6px 0; }
.pend .h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
#msg { min-height: 18px; margin-top: 6px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c" width="1080" height="1350"></canvas></div>
  <div id="panel"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
